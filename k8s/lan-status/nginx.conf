pid /tmp/nginx.pid;

events {}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;
    listen [::]:8080;
    server_name furkanstatus.test;

    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # A short, memorable URL for users on the same Wi-Fi network.
    location = / {
      return 302 /status-page/d379ced1-bc31-4acc-8252-8f1fb571e5b6;
    }

    # The status-page frontend is built with the installation's canonical host.
    # Rewrite only its runtime config so this isolated HTTP listener calls the
    # public API through the LAN hostname (or the LAN IP used by the client).
    location = /status-page/env.js {
      proxy_pass http://oneuptime-nginx.oneuptime.svc.cluster.local:80;
      proxy_http_version 1.1;
      proxy_set_header Host oneuptime.furkan.test;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header Accept-Encoding "";

      sub_filter_once on;
      sub_filter_types application/javascript text/javascript text/plain;
      sub_filter '"HTTP_PROTOCOL":"https"' '"HTTP_PROTOCOL":"http"';
      sub_filter '"HOST":"oneuptime.furkan.test"' '"HOST":"$http_host"';
    }

    # Shared, read-only frontend files required by the selected status page.
    location ^~ /status-page/assets/ {
      proxy_pass http://oneuptime-nginx.oneuptime.svc.cluster.local:80;
      proxy_http_version 1.1;
      proxy_set_header Host oneuptime.furkan.test;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto http;
    }

    location ^~ /status-page/dist/ {
      proxy_pass http://oneuptime-nginx.oneuptime.svc.cluster.local:80;
      proxy_http_version 1.1;
      proxy_set_header Host oneuptime.furkan.test;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto http;
    }

    # Allow only this status page and its child routes (RSS, incident details,
    # and client-side history routes). Other status-page IDs are rejected.
    location = /status-page/d379ced1-bc31-4acc-8252-8f1fb571e5b6 {
      proxy_pass http://oneuptime-nginx.oneuptime.svc.cluster.local:80;
      proxy_http_version 1.1;
      proxy_set_header Host oneuptime.furkan.test;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    location ^~ /status-page/d379ced1-bc31-4acc-8252-8f1fb571e5b6/ {
      proxy_pass http://oneuptime-nginx.oneuptime.svc.cluster.local:80;
      proxy_http_version 1.1;
      proxy_set_header Host oneuptime.furkan.test;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    # OneUptime exposes status-page data through a dedicated public API prefix.
    # This does not expose the dashboard, identity, admin, telemetry, or general
    # /api routes.
    location ^~ /status-page-api/ {
      proxy_pass http://oneuptime-nginx.oneuptime.svc.cluster.local:80;
      proxy_http_version 1.1;
      proxy_set_header Host oneuptime.furkan.test;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    # Deny the dashboard and every route that is not explicitly required above.
    location / {
      return 404;
    }
  }
}
