apiVersion: apps/v1
kind: Deployment
metadata:
  name: oneuptime-lan-status
  labels:
    app.kubernetes.io/name: oneuptime-lan-status
    app.kubernetes.io/part-of: oneuptime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oneuptime-lan-status
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oneuptime-lan-status
        app.kubernetes.io/part-of: oneuptime
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        app: oneuptime-core
      containers:
        - name: nginx
          image: nginx:1.31.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: nginx-config
          configMap:
            name: oneuptime-lan-status-nginx
        - name: temporary-files
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: oneuptime-lan-status
  labels:
    app.kubernetes.io/name: oneuptime-lan-status
    app.kubernetes.io/part-of: oneuptime
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oneuptime-lan-status
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
