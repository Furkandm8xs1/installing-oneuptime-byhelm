apiVersion: apps/v1
kind: Deployment
metadata:
  name: oneuptime-local-tls
  labels:
    app.kubernetes.io/name: oneuptime-local-tls
    app.kubernetes.io/part-of: oneuptime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oneuptime-local-tls
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oneuptime-local-tls
        app.kubernetes.io/part-of: oneuptime
    spec:
      nodeSelector:
        app: oneuptime-core
      containers:
        - name: nginx
          image: nginx:1.31.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-redirect
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: oneuptime-local-tls-nginx
        - name: tls
          secret:
            secretName: oneuptime-local-tls
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: oneuptime-local-tls
  labels:
    app.kubernetes.io/name: oneuptime-local-tls
    app.kubernetes.io/part-of: oneuptime
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oneuptime-local-tls
  ports:
    - name: http
      port: 80
      targetPort: http-redirect
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
