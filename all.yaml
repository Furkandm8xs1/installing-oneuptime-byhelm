# Final merged configuration.
# This file must remain equivalent to: values.yaml + probe2-values.yaml.
# Replace the Probe Two key before using this file directly.

host: "oneuptime.furkan.test"
httpProtocol: https

image:
  pullPolicy: IfNotPresent

clickhouse:
  enabled: true
  nodeSelector:
    app: oneuptime-core

keda:
  enabled: true
  nodeSelector:
    app: oneuptime-core

nginx:
  nodeSelector:
    app: oneuptime-core

postgresql:
  primary:
    nodeSelector:
      app: oneuptime-core

redis:
  master:
    nodeSelector:
      app: oneuptime-core

app:
  nodeSelector:
    app: oneuptime-core

worker:
  nodeSelector:
    app: oneuptime-core

migrate:
  nodeSelector:
    app: oneuptime-core

runner:
  enabled: true
  nodeSelector:
    app: oneuptime-core

deployment:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: "100%"

probes:
  one:
    nodeSelector:
      app: oneuptime-core
  two:
    name: "External-Probe-Node2"
    description: "Probe 2 on Node 2"
    enabled: true
    monitoringWorkers: 3
    monitorFetchLimit: 10
    key: "REPLACE_WITH_THE_NEW_PROBE_KEY"
    replicaCount: 1
    ports:
      http: 3874
    nodeSelector:
      app: oneuptime-probe
