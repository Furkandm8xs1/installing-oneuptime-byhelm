# Base installation values.
# This phase starts the OneUptime core and the internal probe on Node 1.
# Probe Two is intentionally added later, after obtaining a fresh key from the UI.

host: "oneuptime.furkan.test"
httpProtocol: https

# Reuse successfully downloaded images during local Minikube restarts.
image:
  pullPolicy: IfNotPresent

# Core data services from the previously working all.yaml configuration.
clickhouse:
  enabled: true
  nodeSelector:
    app: oneuptime-core

keda:
  enabled: true
  nodeSelector:
    app: oneuptime-core

nginx:
  nodeSelector:
    app: oneuptime-core

postgresql:
  primary:
    nodeSelector:
      app: oneuptime-core

redis:
  master:
    nodeSelector:
      app: oneuptime-core

app:
  nodeSelector:
    app: oneuptime-core

worker:
  nodeSelector:
    app: oneuptime-core

migrate:
  nodeSelector:
    app: oneuptime-core

# In chart 12.x the in-cluster Runner is the AI code-fix component. It
# auto-registers, so a dashboard ID/key is not required.
runner:
  enabled: true
  nodeSelector:
    app: oneuptime-core

# Avoid temporarily running old and new large pods together during upgrades.
deployment:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: "100%"

probes:
  one:
    nodeSelector:
      app: oneuptime-core
